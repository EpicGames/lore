[build]
# NOTE: a per-target [target.<triple>] rustflags table fully REPLACES this
# [build] list rather than merging with it. The lint flags (-W...) below only
# affect warnings and can be safely dropped per-target, but the non-warning
# values here — the --cfg flags the code compiles against (tokio_unstable,
# uuid_unstable) and the codegen -C flags — MUST be duplicated in any
# [target.*] block, or that target builds without them.
rustflags = [
    # Needed for tokio metrics
    "--cfg", "tokio_unstable",
    "-C", "force-unwind-tables=yes",
    "-C", "force-frame-pointers=yes",
    "-Wclippy::all",
    # "-Wclippy::cargo", # TODO(raghav.narula) Enable after duplicate dependencies fixed
    # "-Wclippy::undocumented_unsafe_blocks", # TODO(raghav.narula) enable in follow up
    "-Wclippy::checked_conversions",
    "-Wclippy::dbg_macro",
    "-Wclippy::debug_assert_with_mut_call",
    "-Wclippy::doc_markdown",
    "-Wclippy::empty_enums",
    "-Wclippy::enum_glob_use",
    "-Wclippy::exit",
    "-Wclippy::expl_impl_clone_on_copy",
    "-Wclippy::explicit_deref_methods",
    "-Wclippy::explicit_into_iter_loop",
    "-Wclippy::fallible_impl_from",
    "-Wclippy::filter_map_next",
    "-Wclippy::flat_map_option",
    "-Wclippy::float_cmp_const",
    "-Wclippy::fn_params_excessive_bools",
    "-Wclippy::implicit_clone",
    "-Wclippy::imprecise_flops",
    "-Wclippy::inefficient_to_string",
    "-Wclippy::invalid_upcast_comparisons",
    "-Wclippy::large_digit_groups",
    "-Wclippy::large_futures",
    "-Wclippy::large_stack_arrays",
    "-Wclippy::large_types_passed_by_value",
    "-Wclippy::linkedlist",
    "-Wclippy::lossy_float_literal",
    "-Wclippy::macro_use_imports",
    "-Wclippy::manual_ok_or",
    "-Wclippy::map_err_ignore",
    "-Wclippy::map_unwrap_or",
    "-Wclippy::match_same_arms",
    "-Wclippy::match_wild_err_arm",
    "-Wclippy::match_wildcard_for_single_variants",
    "-Wclippy::mem_forget",
    "-Wclippy::mut_mut",
    "-Wclippy::mutex_integer",
    "-Wclippy::needless_continue",
    "-Wclippy::needless_for_each",
    "-Wclippy::option_option",
    "-Wclippy::path_buf_push_overwrite",
    "-Wclippy::ptr_as_ptr",
    "-Wclippy::rc_mutex",
    "-Wclippy::ref_option_ref",
    "-Wclippy::rest_pat_in_fully_bound_structs",
    "-Wclippy::same_functions_in_if_condition",
    "-Wclippy::semicolon_if_nothing_returned",
    "-Wclippy::single_match_else",
    "-Wclippy::string_add_assign",
    "-Wclippy::string_add",
    "-Wclippy::string_lit_as_bytes",
    "-Wclippy::todo",
    "-Wclippy::trait_duplication_in_bounds",
    "-Wclippy::unimplemented",
    "-Wclippy::uninlined_format_args",
    "-Wclippy::unnested_or_patterns",
    "-Wclippy::unused_async",
    "-Wclippy::unused_self",
    "-Wclippy::verbose_file_reads",
    "-Wclippy::zero_sized_map_values",
    "-Wfuture_incompatible",
    "-Wnonstandard_style",
    "-Wrust_2018_idioms",
    # allows uuid IntoBytes/FromBytes unstable feature
    "--cfg", "uuid_unstable"
]
rustdocflags = ["--cfg", "tokio_unstable"]

[target.x86_64-pc-windows-msvc]
rustflags = [
    "--cfg", "tokio_unstable",
    "-C", "force-unwind-tables=yes",
    "-C", "force-frame-pointers=yes",
    "-C", "target-feature=+crt-static",
    # For Windows builds, always split debuginfo
    "-C", "split-debuginfo=packed",
    # allows uuid IntoBytes/FromBytes unstable feature
    "--cfg", "uuid_unstable"
]
# Using lld on Windows targets has two issues that needs to be resolved
# - incompatible .debug sections in objects and >4GiB pdb
# - ignoring +crt-static and linking dynamically against MSVC runtime
#  The rust flags for this would be ["-C", "linker-flavor=lld-link"]

[target.aarch64-unknown-linux-gnu]
# Portable baseline. For a Graviton3+/Neoverse V1-tuned build, add --config
# .cargo/neoverse-512tvb.toml --features lore-base/neoverse-512tvb.
rustflags = [
    "--cfg", "tokio_unstable",
    "-C", "force-unwind-tables=yes",
    "-C", "force-frame-pointers=yes",
    # Leave debug symbols in the binary for now, we want these in place for the server binary, but still split them via
    # package-cli.sh for CLI binaries.
    "-C", "split-debuginfo=off",
    # allows uuid IntoBytes/FromBytes unstable feature
    "--cfg", "uuid_unstable"
]

# macOS: split-debuginfo=packed emits a separate .dSYM bundle (runs dsymutil);
# the default "unpacked" leaves DWARF in the .o files and ships no .dSYM. Both
# blocks repeat the [build] non-warning flags (see the note there).
[target.x86_64-apple-darwin]
rustflags = [
    "--cfg", "tokio_unstable",
    "-C", "force-unwind-tables=yes",
    "-C", "force-frame-pointers=yes",
    "-C", "split-debuginfo=packed",
    "--cfg", "uuid_unstable"
]

# Apple Silicon — the actual macOS build target.
[target.aarch64-apple-darwin]
rustflags = [
    "--cfg", "tokio_unstable",
    "-C", "force-unwind-tables=yes",
    "-C", "force-frame-pointers=yes",
    "-C", "split-debuginfo=packed",
    "--cfg", "uuid_unstable"
]

[registry]
global-credential-providers = ["cargo:token"]

[env]
# Keeps a machine's service configuration out of anything cargo runs here.
#
# `[service] use_automatically` in the user-level config turns relaying on for
# every Lore call on the machine, this repository's tests included: with it on,
# `cargo test -p lore` fails 202 of its unit tests and every one of its
# integration targets, because each call goes to a service that knows nothing of
# the fixture it was set up against. A developer who turns the service on for
# their own use should not thereby be unable to run the tests.
#
# Set without `force`, so a value already in the environment still wins —
# `LORE_USE_SERVICE=1 cargo run -- status` relays as it says. It also applies to
# `cargo run`, which is right for the same reason: the binary cargo just built is
# not the one `[service] executable` names, so relaying to that service would run
# a different build than the one asked for.
#
# The unit tests are covered a second way, in the routing decision itself, since
# they are not always run through cargo.
LORE_USE_SERVICE = "0"

# Keeps anything cargo runs off the socket a developer's own service answers on.
#
# The setting above is no protection here: `service stop` connects to whatever is
# listening whether or not calls relay, so a test calling it would end the service
# a developer had running and say it succeeded. Every service on a machine answers
# on one per-user socket by default, which is what makes one service serve every
# command — and what makes a test able to stop the wrong one.
#
# A fixed name rather than a unique one, because this file cannot compute one. It
# is the floor: it holds for every test written from here on without any of them
# remembering it, which is the failure this guards against — `LORE_SERVICE_SOCKET`
# was added for exactly this and the first Rust test to call `stop` still went to
# the default. A target that runs concurrently with another names its own on top
# of this, as `lore/tests/service_api.rs` does.
#
# Applies to `cargo run` too, and should: the binary cargo just built is not the
# one a machine's service is running, so sharing a socket would have it served by
# a different build than the one being run.
LORE_SERVICE_SOCKET = "lore_service-cargo"
