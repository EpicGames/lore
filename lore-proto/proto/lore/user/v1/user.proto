syntax = "proto3";

package lore.user.v1;

// User directory. Clients call this service to resolve user names and ids.
// Every RPC is called with the caller's token in the gRPC metadata as
// `authorization: Bearer <token>`.
service UserService {
  // Resolve user IDs to users. IDs the directory does not know are omitted
  // from the answer rather than reported as errors.
  rpc UserGet(UserGetRequest) returns (UserGetResponse);
  // Find the users whose username or display name equals a given name.
  rpc UserFind(UserFindRequest) returns (UserFindResponse);
}

// A 3rd party registry of the repositories and the users' permissions
// on them. The Lore server calls it with the caller's token: it registers a
// repository on create, unregisters it on delete, and asks it which
// repositories a caller may list. Every RPC is called with the token in the
// gRPC metadata as `authorization: Bearer <token>`.
service RepositoryRegistryService {
  // Stream the repositories the bearer holds permissions on, one per
  // message, with the permissions held on each. Repositories the bearer
  // holds no permission on are not listed.
  rpc RepositoryList(RepositoryListRequest) returns (stream RepositoryListResponse);
  // Register a repository the Lore server is creating, with the caller as
  // its owner, so that `RepositoryList` lists it. The Lore server calls this
  // before it stores the repository and refuses the create when this fails.
  rpc RepositoryRegister(RepositoryRegisterRequest) returns (RepositoryRegisterResponse);
  // Unregister a repository the Lore server is deleting. The Lore server
  // refuses the delete when this fails, so the registry authorizes the
  // delete.
  rpc RepositoryUnregister(RepositoryUnregisterRequest) returns (RepositoryUnregisterResponse);
}

// A user as the directory knows them.
message User {
  // The durable user identifier, the value Lore records as a repository's
  // `creator`, a revision's author or a lock's `owner`.
  string id = 1;
  // The name shown for the user.
  string display_name = 2;
  // The login name, unique among the directory's users. In OIDC tokens
  // this is `preferred_username`. Empty when the directory has none.
  string username = 3;
}

// Request to resolve user IDs within a partition.
message UserGetRequest {
  // The partition the caller is working in, so a directory that
  // scopes user visibility by partition can restrict its answer.
  // A directory that does not scope by partition ignores it.
  bytes partition = 1;
  // The user IDs to resolve.
  repeated string id = 2;
}

// Response carrying the users known by the directory.
message UserGetResponse {
  // One entry per requested ID the directory knows, each carrying its `id`,
  // so the order carries no meaning. Unknown IDs are absent.
  repeated User user = 1;
}

// Request to find users by name within a partition.
message UserFindRequest {
  // The partition the caller is working in. See `UserGetRequest`.
  bytes partition = 1;
  // Which field the name is matched against, exactly.
  oneof query {
    // `User.username`. Unique, so at most one user matches.
    string username = 2;
    // `User.display_name`. Not unique, so several users may match.
    string display_name = 3;
  }
}

// Response carrying every user the query matched.
message UserFindResponse {
  // The matching users. Empty when none matches.
  repeated User user = 1;
}

// Request to stream the caller's repositories. The caller ID is read from
// the token.
message RepositoryListRequest {}

// One-per-stream-message response carrying a single repository the bearer
// holds permissions on.
message RepositoryListResponse {
  // The repository id.
  bytes id = 1;
  // The permission names the bearer holds on the repository.
  repeated string permission = 2;
}

// Request to register a repository. The credential is the token of the
// caller creating the repository, forwarded by the Lore server. It cannot be
// scoped to the repository, which does not exist yet, so the registry must
// accept the authn token.
message RepositoryRegisterRequest {
  // The repository id.
  bytes id = 1;
  // The repository name.
  string name = 2;
}

// Response to a repository register. Registering a repository already
// registered under the same name succeeds for any caller allowed to
// register it, so a retried create does too. A repository registered under
// another name answers `ALREADY_EXISTS`, and the Lore server refuses the
// create.
message RepositoryRegisterResponse {}

// Request to unregister a repository. The credential is the token the caller
// sent with the delete, forwarded by the Lore server: a token scoped to the
// repository when the client signed in over OIDC, and the login token
// otherwise, so the registry must accept either. The registry must refuse a
// caller without permission to delete the repository with
// `PERMISSION_DENIED`.
message RepositoryUnregisterRequest {
  // The repository id.
  bytes id = 1;
}

// Response to a repository unregister. Unregistering a repository that is
// not registered succeeds.
message RepositoryUnregisterResponse {}
