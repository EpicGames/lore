syntax = "proto3";

package lore.storage.v1;

import "lore/model/v1/model.proto";

// Streaming contract for Get / GetMetadata / Put / Copy:
//
// These RPCs multiplex many independent item requests onto one long-lived stream,
// and the server answers out of order. A failure attributable to a single item is
// therefore reported in-band, via that item's `status` field, and the stream stays
// open. A terminal gRPC `Status` means the stream itself is unusable — the request
// stream failed to decode, or the RPC was rejected before any item was read — and
// every outstanding request on it must be retried on a fresh stream.
//
// The per-item fields keep the numbers they had before `status` existed, so a peer that
// predates it still decodes what it understands. Such a peer reports a per-item failure
// the only way it can, by ending the stream, which is why an absent status reads as `OK`.
//
// A status other than `OK` decides the item on its own: the reader must not consult the
// other fields, whatever they contain.
service StorageService {
    rpc Get(stream lore.model.v1.Address) returns (stream GetResponse);
    // GetMetadata: same wire request as Get (just an Address), but the server's response
    // carries Fragment only — no payload bytes. Used by callers that need fragment metadata
    // (size, flags) for existence/size lookups without paying the payload transfer cost.
    rpc GetMetadata(stream lore.model.v1.Address) returns (stream GetResponse);
    // GetResolved: mutable key -> immutable blob in one round trip. The key is always read as
    // KeyType::Resolve, so no key type is carried. Streaming for the same reason Get is: the
    // storage API resolves keys in batches, so requests pipeline over one long-lived stream
    // instead of paying per-call setup and metadata injection.
    rpc GetResolved(stream GetResolvedRequest) returns (stream GetResolvedResponse);
    // PutResolved: store a fragment and publish a mutable key naming it, in one round trip. The
    // write side of GetResolved, and the only thing that makes a key resolvable. Shares
    // GetResolved's correlation and in-band status shape.
    rpc PutResolved(stream PutResolvedRequest) returns (stream PutResolvedResponse);
    rpc Put(stream PutRequest) returns (stream PutResponse);
    rpc Query(QueryRequest) returns (QueryResponse);
    rpc Verify(VerifyRequest) returns (VerifyResponse);
    rpc Copy(stream CopyRequest) returns (stream CopyResponse);
    rpc MutableLoad(MutableLoadRequest) returns (MutableLoadResponse);
    rpc MutableStore(MutableStoreRequest) returns (MutableStoreResponse);
    rpc MutableCompareAndSwap(MutableCompareAndSwapRequest) returns (MutableCompareAndSwapResponse);
}

// One item's outcome on the Get / GetMetadata response stream.
//
// `address` is populated on success and failure alike — it is the key the client
// demultiplexes on, since the server answers out of order. A per-item failure
// arrives as `status` rather than as a stream `Status`, so a miss on one address
// leaves every other request on the stream intact.
message GetResponse {
    lore.model.v1.Address address = 1;
    // Meaningful only when `status` is `OK` or absent. `payload` is always empty for
    // GetMetadata, which carries Fragment only.
    lore.model.v1.Fragment fragment = 2;
    bytes payload = 3;
    // `OK` for a served fragment, the failure otherwise.
    //
    // Absence means `OK`: the field postdates the original response, so a server without it
    // reports a per-item failure the only way it could, by ending the stream.
    //
    // Anything other than `OK` decides the item on its own. A reader must not consult
    // `fragment` or `payload` in that case, whatever they contain.
    lore.model.v1.ItemStatus status = 4;
}

// One resolve-and-read on the GetResolved request stream.
message GetResolvedRequest {
    // Transport-assigned correlation handle, unique per stream, mirroring the QUIC
    // CommandHeader's `command_id`. Never zero; a zero id cannot be correlated and is the one
    // malformed-request case the server answers with a stream-level error.
    uint64 request_id = 1;
    // `key.hash` is a mutable key, not a content hash; `key.context` is the context the
    // resolved hash is read at.
    lore.model.v1.Address key = 2;
    // Reserved bitmask; unknown bits are rejected rather than ignored.
    uint32 flags = 3;
}

// One item's outcome on the GetResolved response stream.
message GetResolvedResponse {
    // Echoes the request's `request_id`. Set on every response, success or failure.
    uint64 request_id = 1;
    // This item's outcome. Absent or code 0 (OK) means the remaining fields are valid; anything
    // else means they are unset and the item failed. The stream continues either way.
    lore.model.v1.ItemStatus status = 2;
    // What the key resolved to. Addressed at the request's `key.context`.
    bytes resolved = 3;
    // Describes the payload below: its encoding, and the content size behind it.
    lore.model.v1.Fragment fragment = 4;
    // The stored representation of `resolved`, still encoded as `fragment` describes. A
    // fragmented root carries the reference list rather than content; its leaves follow
    // separately over Get.
    bytes payload = 5;
}

// One store-and-publish on the PutResolved request stream.
message PutResolvedRequest {
    // Transport-assigned correlation handle, unique per stream. Never zero; see GetResolvedRequest.
    uint64 request_id = 1;
    // Mutable key to publish `address.hash` under, as KeyType::Resolve.
    bytes key = 2;
    // Content address of the fragment being stored. A zero hash removes the key's mapping
    // instead of publishing one, and then `fragment` and `payload` are ignored.
    lore.model.v1.Address address = 3;
    // Describes the payload below, as on Put.
    lore.model.v1.Fragment fragment = 4;
    // The fragment's stored representation. Required: publishing a key against a metadata-only
    // write would map it to content the server does not hold.
    bytes payload = 5;
}

// One item's outcome on the PutResolved response stream.
message PutResolvedResponse {
    // Echoes the request's `request_id`. Set on every response, success or failure.
    uint64 request_id = 1;
    // This item's outcome; absent or code 0 (OK) means the key was published. The stream
    // continues either way.
    lore.model.v1.ItemStatus status = 2;
}

message PutRequest {
    lore.model.v1.Address address = 1;
    lore.model.v1.Fragment fragment = 2;
    optional bytes payload = 3;
}

// One item's outcome on the Put response stream, reported the same way as Get.
message PutResponse {
    lore.model.v1.Address address = 1;
    // `OK` for a stored fragment, the failure otherwise. Absence means `OK`, and anything
    // other than `OK` decides the item on its own, both as on Get.
    lore.model.v1.ItemStatus status = 2;
}

message QueryRequest {
    repeated lore.model.v1.Address addresses = 1;
}

message QueryResponse {
    repeated lore.model.v1.FragmentState results = 1;
}

message VerifyRequest {
    lore.model.v1.Address address = 1;
    bool heal = 2;
}

enum HealResult {
    NOT_ATTEMPTED = 0;
    SUCCESS = 1;
    FAILED = 2;
}

message VerifyResponse {
    HealResult healed = 1;
    bool corrupted = 2;
}

message CopyRequest {
    bytes source_repository_id = 1;
    lore.model.v1.Address source_address = 2;
    // Destination context. The destination address is
    // (target_repository, source_address.hash, target_context). When omitted (zero bytes), the
    // server treats the destination context as the source's, preserving legacy semantics.
    bytes target_context = 3;
}

// One item's outcome on the Copy response stream, reported the same way as Get.
message CopyResponse {
    bytes source_repository_id = 1;
    lore.model.v1.Address source_address = 2;
    // `OK`, or the failure — a missing source fragment is an expected outcome that the
    // caller's tier-2 fallback pattern-matches on. Absence means `OK`, and anything other
    // than `OK` decides the item on its own, both as on Get.
    lore.model.v1.ItemStatus status = 3;
}

message MutableLoadRequest {
    bytes key = 1;
    uint32 key_type = 2;
}

message MutableLoadResponse {
    bytes value = 1;
}

message MutableStoreRequest {
    bytes key = 1;
    bytes value = 2;
    uint32 key_type = 3;
}

message MutableStoreResponse {}

message MutableCompareAndSwapRequest {
    bytes key = 1;
    bytes expected = 2;
    bytes value = 3;
    uint32 key_type = 4;
}

message MutableCompareAndSwapResponse {
    bytes current_value = 1;
}
