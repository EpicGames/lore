[package]
name = "lore-capi"
edition = "2024"
version.workspace = true
publish = false

# The C library, named `lore` so it builds as liblore.so, liblore.dylib or lore.dll, and liblore.a
# or lore.lib. The build script generates lore.h.
[lib]
name = "lore"
crate-type = ["cdylib", "staticlib"]
test = false
doctest = false

[dependencies]
lore-library = { package = "lore", path = "../lore" }

[build-dependencies]
cbindgen = { version = "=0.29.2", default-features = false }
cc = "1.2.32"
glob = "0.3.2"
blake3 = { workspace = true }
regex = "1.11.1"

[features]
default = []
oodle = ["lore-library/oodle"]
swfs = ["lore-library/swfs"]
