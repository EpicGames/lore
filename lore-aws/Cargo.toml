[package]
name = "lore-aws"
edition = "2024"
version.workspace = true
publish = false

[lib]
test = false

[dependencies]
async-trait = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
crc32fast = { workspace = true }
dashmap = { workspace = true }
hex = { workspace = true }
http = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-semantic-conventions = { workspace = true }
parking_lot = { workspace = true }
reqwest = { workspace = true }
ring = { workspace = true }
smallvec = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_bytes = { workspace = true }
serde_json = { workspace = true, features = ["std"] }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
zerocopy = { workspace = true }
lore-base = { workspace = true }
lore-storage = { workspace = true }
lore-revision = { workspace = true }
lore-error-set = { workspace = true }
lore-macro = { workspace = true }
lore-telemetry = { workspace = true }
# Stands in for the S3 and DynamoDB facades in this crate's own tests, behind `test-util`. The
# stores name those facades directly, so the double has to be built into the library.
mockall = { workspace = true, optional = true }

[dev-dependencies]
mockall = { workspace = true }
# `testing` for the in-memory exporter the metric tests read measurements back from.
opentelemetry_sdk = { workspace = true, features = ["testing"] }
# The reference encoder `tests/unit/aws/differential.rs` holds this crate's serde bridge against, for
# every row shape the stores write.
serde_dynamo = { version = "4.2.14" }
rand = { workspace = true }
serial_test = { workspace = true }
# `async_closure` so a provider that reads the environment can be tested from an async test.
temp-env = { workspace = true, features = ["async_closure"] }
# `test-util` for paused time, so retry and refresh schedules are asserted rather than spent.
tokio = { workspace = true, features = ["test-util"] }
lore-aws = { workspace = true, features = ["test-util"] }
lore-base = { workspace = true, features = ["test-util"] }

[features]
default = []
test-util = ["dep:mockall"]

[lints]
workspace = true
