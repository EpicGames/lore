name: Publish loreserver image

# Builds lore-server/Dockerfile for linux/amd64 and linux/arm64, publishes
# multi-arch images to ghcr.io/epicgames/lore/loreserver, and signs them with
# keyless cosign so the community Helm chart can reference a verifiable tag.
#
# Two variants ship, differing only in how arm64 is compiled:
#
#   :X.Y.Z            baseline armv8-a arm64 — runs on any arm64 host
#   :X.Y.Z-graviton   arm64 tuned for Graviton3+, as Lore is deployed
#
# The default is portable so a community chart works everywhere; the tuned
# build is opt-in. amd64 is baseline in both, so it is built once and both
# manifest lists point at that digest.
#
# `meta` resolves tags and labels once, so the later jobs cannot disagree. Each
# leg builds on its own native runner (QEMU is far too slow for a release Rust
# build) and pushes by digest. `merge` stitches those into an index, signs and
# verifies it under a staging tag, and only then attaches the release tags — so
# no release tag is ever left pointing at an unsigned image.
#
# No secrets: GITHUB_TOKEN authenticates to GHCR, and cosign signs keylessly
# against Fulcio via the job's OIDC token.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Extra tag to publish, for proving the workflow from a branch
          (for example "edge"). Blank tags from the ref alone.
        type: string
        required: false

permissions: {}

concurrency:
  group: publish-loreserver-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/epicgames/lore/loreserver
  # Passed to the Dockerfile for the tuned arm64 leg only.
  GRAVITON_TARGET_CPU: neoverse-512tvb

jobs:
  meta:
    name: resolve tags
    runs-on: ubuntu-latest
    permissions:
      contents: read # metadata-action reads repository metadata for OCI labels
    outputs:
      json: ${{ steps.meta.outputs.json }}
      graviton-json: ${{ steps.meta-graviton.outputs.json }}
      labels: ${{ steps.meta.outputs.labels }}
      annotations: ${{ steps.meta.outputs.annotations }}
      graviton-labels: ${{ steps.meta-graviton.outputs.labels }}
      graviton-annotations: ${{ steps.meta-graviton.outputs.annotations }}
    steps:
      # The input lands verbatim in the `tags` list below, where a newline
      # would smuggle in a further directive. Hold it to Docker's grammar.
      - name: Validate the tag input
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          case "${TAG}" in
            "") exit 0 ;;
            [!A-Za-z0-9_]* | *[!A-Za-z0-9._-]*)
              echo "::error::the 'tag' input is not a valid image tag: expected [A-Za-z0-9_][A-Za-z0-9._-]*"
              exit 1
              ;;
          esac
          if [ "${#TAG}" -gt 128 ]; then
            echo "::error::the 'tag' input is longer than the 128 characters a tag allows"
            exit 1
          fi

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # Only a stable semver tag moves `latest`; a prerelease publishes
          # its own tag and nothing else.
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}

      # The same tags, suffixed. `onlatest` carries the suffix onto `latest`, so
      # the tuned stream has its own moving tag instead of fighting for that one.
      - id: meta-graviton
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=auto
            suffix=-graviton,onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}

      # An empty list has to fail here, not as an invalid reference in `merge`
      # once every architecture has already been built.
      - name: Require at least one tag
        env:
          JSON: ${{ steps.meta.outputs.json }}
          GRAVITON_JSON: ${{ steps.meta-graviton.outputs.json }}
        run: |
          set -euo pipefail
          for tags_json in "$JSON" "$GRAVITON_JSON"; do
            if [ -z "$(jq -r '.tags[0] // empty' <<< "${tags_json}")" ]; then
              echo "::error::no image tags resolved for ${GITHUB_REF}; push a semver tag or pass the 'tag' input"
              exit 1
            fi
          done

  build:
    name: build (${{ matrix.arch }}${{ matrix.variant == 'graviton' && ', graviton' || '' }})
    needs: meta
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read # Check out the source the image is built from
      packages: write # Push the per-arch manifest, addressed by digest
    strategy:
      fail-fast: false
      matrix:
        include:
          # amd64 is baseline for both variants, so it is built once and shared.
          - { arch: amd64, variant: base, platform: linux/amd64, runner: ubuntu-latest }
          - { arch: arm64, variant: base, platform: linux/arm64, runner: ubuntu-24.04-arm }
          - { arch: arm64, variant: graviton, platform: linux/arm64, runner: ubuntu-24.04-arm }
    env:
      # The graviton leg carries the suffixed tag's metadata, so `docker inspect`
      # tells the two arm64 variants apart. The shared amd64 leg can only carry
      # one set, which is the default's.
      LABELS: ${{ matrix.variant == 'graviton' && needs.meta.outputs.graviton-labels || needs.meta.outputs.labels }}
      ANNOTATIONS: ${{ matrix.variant == 'graviton' && needs.meta.outputs.graviton-annotations || needs.meta.outputs.annotations }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # An untuned build is a perfectly successful one, so an empty expression
      # below would ship a baseline image under the -graviton tag with every
      # step green. Assert it here, where it costs only a fast failure.
      - name: Check the graviton leg is tuned
        if: ${{ matrix.variant == 'graviton' }}
        env:
          TARGET_CPU: ${{ matrix.variant == 'graviton' && env.GRAVITON_TARGET_CPU || '' }}
        run: |
          if [ -z "${TARGET_CPU}" ]; then
            echo "::error::no arm64 target CPU resolved for the graviton leg; it would build baseline armv8-a and publish it as tuned"
            exit 1
          fi
          echo "tuning arm64 for ${TARGET_CPU}"

      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: lore-server/Dockerfile
          platforms: ${{ matrix.platform }}
          # From the workflow env, not a matrix column, so retuning Graviton is
          # one edit. `env` is unavailable in `strategy.matrix`, hence deriving
          # it here. Empty is baseline, and amd64 ignores it either way.
          build-args: ARM64_TARGET_CPU=${{ matrix.variant == 'graviton' && env.GRAVITON_TARGET_CPU || '' }}
          labels: ${{ env.LABELS }}
          annotations: ${{ env.ANNOTATIONS }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Only the apt and toolchain layers survive a source change: the cargo
          # registry and target dir live in cache mounts, which the gha backend
          # does not carry between runs, so the compile starts cold every time.
          # Scoped per variant so the two arm64 legs cannot share layers.
          cache-from: type=gha,scope=loreserver-${{ matrix.arch }}-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=loreserver-${{ matrix.arch }}-${{ matrix.variant }}

      # A clean build proves only that the image compiles, so start the binary
      # too: it catches a broken entrypoint or a missing shared library. It does
      # NOT catch codegen for a CPU the host lacks — this runner is Neoverse-N2
      # and reports SVE, so it runs the Graviton build happily, which is how a
      # SIGILL-ing arm64 image once passed a fully green run.
      - name: Smoke test the pushed image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: docker run --rm "${IMAGE}@${DIGEST}" --version

      # Hand each digest over as an empty file named after itself, one artifact
      # per leg, so `merge` can pick which legs belong in which manifest list.
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          touch "${{ runner.temp }}/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.arch }}-${{ matrix.variant }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: merge and sign (${{ matrix.variant }})
    needs: [meta, build]
    # `needs: build` alone requires the whole matrix to pass, letting the opt-in
    # graviton leg withhold the portable default image. Wait for the legs to
    # finish, not to pass; `meta` stays required, since a variant with no tags
    # has nothing to publish. Which legs a variant needs is the check's call
    # below.
    if: ${{ !cancelled() && needs.meta.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      packages: write # Push the manifest list and the cosign signature
      id-token: write # Federate to Fulcio for keyless signing
    strategy:
      # One variant failing should not withhold the other.
      fail-fast: false
      matrix:
        include:
          - variant: default
            legs: digests-amd64-base digests-arm64-base
          - variant: graviton
            legs: digests-amd64-base digests-arm64-graviton
    env:
      JSON: ${{ matrix.variant == 'graviton' && needs.meta.outputs.graviton-json || needs.meta.outputs.json }}
      LEGS: ${{ matrix.legs }}
      # Where the index lands before it is signed. Commit-addressed, so it never
      # moves; kept afterwards as a record of which commit produced which digest.
      STAGING_TAG: sha-${{ github.sha }}${{ matrix.variant == 'graviton' && '-graviton' || '' }}
      # Anchored on this workflow's path: a bare repository prefix would
      # accept a certificate minted by any workflow here.
      IDENTITY_REGEXP: '^https://github\.com/${{ github.repository }}/\.github/workflows/publish-loreserver-image\.yml@'
    steps:
      # No merge-multiple: each leg keeps its own subdirectory so the right
      # subset can be selected below.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Phase one: the index under the staging tag alone, so a failure before
      # the signature verifies cannot leave a release tag — `latest` above all —
      # pointing at an unsigned digest. Release tags are attached further down.
      - name: Create the multi-arch manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          args=(--tag "${IMAGE}:${STAGING_TAG}")
          # The build job annotated each per-arch manifest; the index is created
          # here, so it needs the same. They must land now: annotations are part
          # of the digest, and promotion below must not alter it.
          while IFS= read -r annotation; do
            args+=(--annotation "index:${annotation}")
          done < <(jq -r '.labels | to_entries[] | "\(.key)=\(.value)"' <<< "$JSON")
          for leg in ${LEGS}; do
            if [ ! -d "${leg}" ]; then
              echo "::error::${leg} did not produce a digest; refusing to publish a partial manifest list"
              exit 1
            fi
            for digest in "${leg}"/*; do
              args+=("${IMAGE}@sha256:$(basename "${digest}")")
            done
          done
          docker buildx imagetools create "${args[@]}"

      - name: Inspect the manifest list
        run: docker buildx imagetools inspect "${IMAGE}:${STAGING_TAG}"

      - id: digest
        name: Resolve the manifest list digest
        run: |
          set -euo pipefail
          digest=$(docker buildx imagetools inspect "${IMAGE}:${STAGING_TAG}" \
            --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Sign the manifest list by digest, not by tag: a tag can later be moved
      # to point at something else, a digest cannot.
      - name: Sign the image with cosign
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Verify the signature
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          set -euo pipefail
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity-regexp "${IDENTITY_REGEXP}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            > /dev/null
          echo "signature verified"

      # Promotion rests on `imagetools create` copying a lone index source
      # through unchanged. Prove that first by copying the index onto the tag it
      # already occupies: a no-op while the digest holds, and if some later
      # buildx stops preserving it, the tag that moves out from under the
      # signature is this one, which nothing consumes. Checking afterwards
      # instead would mean learning it from `latest`.
      - name: Prove the copy preserves the digest
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag "${IMAGE}:${STAGING_TAG}" "${IMAGE}@${DIGEST}"
          resolved=$(docker buildx imagetools inspect "${IMAGE}:${STAGING_TAG}" \
            --format '{{json .Manifest}}' | jq -r .digest)
          if [ "${resolved}" != "${DIGEST}" ]; then
            echo "::error::copying the index changed its digest (${DIGEST} -> ${resolved}); refusing to move the release tags off the signed digest"
            exit 1
          fi
          echo "copy is digest-preserving"

      # Phase two: the release tags, now the signature exists and verifies. Each
      # is re-resolved afterwards, so a tag off the signed digest fails the run.
      - name: Promote the signed digest to the release tags
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r tag; do
            args+=(--tag "${tag}")
          done < <(jq -r '.tags[]' <<< "$JSON")
          docker buildx imagetools create "${args[@]}" "${IMAGE}@${DIGEST}"
          while IFS= read -r tag; do
            resolved=$(docker buildx imagetools inspect "${tag}" \
              --format '{{json .Manifest}}' | jq -r .digest)
            if [ "${resolved}" != "${DIGEST}" ]; then
              echo "::error::${tag} resolved to ${resolved}, not the signed ${DIGEST}"
              exit 1
            fi
            echo "${tag} -> ${resolved}"
          done < <(jq -r '.tags[]' <<< "$JSON")

      - name: Summarise what was published
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          {
            echo "## Published \`${IMAGE}\` (${VARIANT})"
            echo ""
            echo "Digest: \`${DIGEST}\`"
            echo ""
            if [ "${VARIANT}" = "graviton" ]; then
              echo "Platforms: linux/amd64 (baseline), linux/arm64 (tuned for Graviton3+ — will not run on older arm64)"
            else
              echo "Platforms: linux/amd64, linux/arm64 (baseline armv8-a)"
            fi
            echo ""
            echo "Tags:"
            jq -r '.tags[] | "- `" + . + "`"' <<< "$JSON"
            echo "- \`${IMAGE}:${STAGING_TAG}\` (staging tag the signature was made against)"
            echo ""
            echo "Verify the signature with:"
            echo ""
            echo '```sh'
            echo "cosign verify ${IMAGE}@${DIGEST} \\"
            echo "  --certificate-identity-regexp '${IDENTITY_REGEXP}' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
