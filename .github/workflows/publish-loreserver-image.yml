name: Publish loreserver image

# Packages the loreserver binaries from a published GitHub release into signed
# images at ghcr.io/epicgames/lore/loreserver. Nothing is compiled here.
#
#   :X.Y.Z            linux/amd64 alone, as a plain manifest
#   :X.Y.Z-graviton   linux/amd64 plus linux/arm64 tuned for Graviton3+
#
# Releases ship no baseline armv8-a Linux binary, so arm64 goes only under the
# suffixed tag. lore-server/DOCKER.md has the reasoning and which tag to pull.
#
# On `release: published` rather than the tag push, because assets are uploaded
# to a draft and published by hand hours or days later.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release:
        description: >-
          Release tag to package, for example "v0.9.0". Required: with no
          release event there is nothing to infer it from.
        type: string
        required: true
      tag:
        description: >-
          Extra tag to publish, for proving the workflow (for example "edge").
          Both variants publish it, the tuned one suffixed. Required when
          dispatching from a branch other than the default one, which
          publishes this tag alone and no release tags.
        type: string
        required: false

permissions: {}

concurrency:
  group: publish-loreserver-image-${{ inputs.release || github.event.release.tag_name }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/epicgames/lore/loreserver
  # Part of the arm64 asset's name; one edit if the release stream retunes.
  ARM64_TUNING: neoverse-512tvb

jobs:
  meta:
    name: resolve tags
    runs-on: ubuntu-latest
    permissions:
      contents: read # metadata-action reads repository metadata for OCI labels
    outputs:
      version: ${{ steps.version.outputs.version }}
      json: ${{ steps.meta.outputs.json }}
      labels: ${{ steps.meta.outputs.labels }}
      annotations: ${{ steps.meta.outputs.annotations }}
      graviton-json: ${{ steps.meta-graviton.outputs.json }}
      graviton-labels: ${{ steps.meta-graviton.outputs.labels }}
      graviton-annotations: ${{ steps.meta-graviton.outputs.annotations }}
    env:
      # The version comes from an input, so without this a dispatch from a pull
      # request branch would move the real release tags onto unreviewed code.
      # Open for a release, and for a dispatch from the default branch, which
      # is how a release predating this workflow gets backfilled.
      RELEASE_TAGS: ${{ github.event_name == 'release' || github.ref_name == github.event.repository.default_branch }}
    steps:
      - id: version
        name: Resolve and validate the release version
        env:
          VERSION: ${{ inputs.release || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [ -z "${VERSION}" ]; then
            echo "::error::no release version resolved; pass the 'release' input"
            exit 1
          fi
          if ! printf '%s' "${VERSION}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "::error::'${VERSION}' is not a release tag of the form v1.2.3"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # `latest=auto` hands `latest` to any non-prerelease without consulting
      # what is already published, so a backfill or a hotfix of an older line
      # would move it backwards. Hence latest=false below and this gate.
      - id: latest
        name: Decide whether this is the newest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          latest=false
          # Anything carrying a prerelease or build suffix never takes `latest`.
          if printf '%s' "${VERSION}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            newest=$(gh release list --exclude-drafts --exclude-pre-releases --limit 100 \
              --json tagName --jq '.[].tagName' \
              | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } \
              | sort -V | tail -1)
            # Ties count: the release being published is itself in that list.
            if [ "$(printf '%s\n%s\n' "${VERSION}" "${newest}" | sort -V | tail -1)" = "${VERSION}" ]; then
              latest=true
            fi
            echo "newest released is '${newest}'"
          fi
          echo "latest=${latest}" >> "$GITHUB_OUTPUT"
          echo "latest=${latest}"

      # The input lands verbatim in the `tags` lists below, where a newline
      # would smuggle in a further directive.
      - name: Validate the tag input
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          case "${TAG}" in
            "") exit 0 ;;
            [!A-Za-z0-9_]* | *[!A-Za-z0-9._-]*)
              echo "::error::the 'tag' input is not a valid image tag: expected [A-Za-z0-9_][A-Za-z0-9._-]*"
              exit 1
              ;;
          esac
          if [ "${#TAG}" -gt 128 ]; then
            echo "::error::the 'tag' input is longer than the 128 characters a tag allows"
            exit 1
          fi

      # Manifest-level annotations only, the action's default: buildx rejects
      # index annotations on this variant's single-platform export.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }},enable=${{ env.RELEASE_TAGS }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }},enable=${{ env.RELEASE_TAGS }}
            type=raw,value=latest,enable=${{ env.RELEASE_TAGS == 'true' && steps.latest.outputs.latest == 'true' }}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}

      # The suffix reaches every tag including the raw `latest`, so the tuned
      # stream gets its own moving tag rather than taking that one.
      - id: meta-graviton
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index,manifest
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
            suffix=-graviton
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }},enable=${{ env.RELEASE_TAGS }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }},enable=${{ env.RELEASE_TAGS }}
            type=raw,value=latest,enable=${{ env.RELEASE_TAGS == 'true' && steps.latest.outputs.latest == 'true' }}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}

      # Here, not as an invalid reference once the images are already pushed.
      - name: Require at least one tag
        env:
          JSON: ${{ steps.meta.outputs.json }}
          GRAVITON_JSON: ${{ steps.meta-graviton.outputs.json }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          for tags_json in "$JSON" "$GRAVITON_JSON"; do
            if [ -z "$(jq -r '.tags[0] // empty' <<< "${tags_json}")" ]; then
              echo "::error::no image tags resolved for ${VERSION}; a dispatch from a branch publishes only the 'tag' input, so pass one"
              exit 1
            fi
          done

  build:
    name: package and push
    needs: meta
    runs-on: ubuntu-latest
    permissions:
      contents: read # Check out the Dockerfile and config, and read the release
      packages: write # Push each variant, addressed by digest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      graviton-digest: ${{ steps.build-graviton.outputs.digest }}
      amd64-sha256: ${{ steps.fetch.outputs.amd64-sha256 }}
      arm64-sha256: ${{ steps.fetch.outputs.arm64-sha256 }}
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      # No `ref`: the packaging must come from the ref this workflow ran from.
      # A release predating this workflow has no Dockerfile.release at its tag,
      # and backfilling one is a supported dispatch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The config does come from the release tag, since keys move between
      # releases — main has renamed and added some since v0.9.0 — and a
      # dispatch checks out whatever ref it was dispatched from. On a release
      # run this rewrites the file with itself.
      - name: Take default.toml from the release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          path=lore-server/config/default.toml
          if ! gh api "repos/{owner}/{repo}/contents/${path}?ref=${VERSION}" \
              -H 'Accept: application/vnd.github.raw' > default.toml.tag; then
            echo "::error::release ${VERSION} has no ${path}"
            exit 1
          fi
          mv default.toml.tag "${path}"

      # One directory per platform, which the Dockerfile selects on TARGETARCH.
      - id: fetch
        name: Fetch the released binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for spec in \
            "amd64:loreserver-${VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            "arm64:loreserver-${VERSION}-aarch64-unknown-linux-gnu-${ARM64_TUNING}.tar.gz"
          do
            arch="${spec%%:*}"
            asset="${spec#*:}"
            mkdir -p "dist/${arch}"
            if ! gh release download "${VERSION}" --pattern "${asset}" --dir . --clobber; then
              echo "::error::could not download ${asset} from release ${VERSION}; check the release has that asset attached"
              exit 1
            fi
            # The release publishes no checksums, so record what arrived; it is
            # carried into the image labels below.
            sha="$(sha256sum "${asset}" | cut -d' ' -f1)"
            echo "${arch}-sha256=${sha}" >> "$GITHUB_OUTPUT"
            echo "${asset} sha256=${sha}"
            tar -xzf "${asset}" -C "dist/${arch}"
            rm -f "${asset}"
            if [ ! -f "dist/${arch}/loreserver" ]; then
              echo "::error::${asset} did not contain ./loreserver"
              exit 1
            fi
            # The archive stores it 0644 and COPY carries the context's mode
            # into the image, so without this every container dies at startup.
            chmod +x "dist/${arch}/loreserver"
          done

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # push-by-digest pushes under no tag, which is what leaves each variant
      # unnamed until its signature exists. Annotations must land here: they
      # are part of the digest, and promotion must not alter it.
      - id: build-graviton
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: lore-server/Dockerfile.release
          platforms: linux/amd64,linux/arm64
          labels: |
            ${{ needs.meta.outputs.graviton-labels }}
            com.epicgames.lore.asset.amd64.sha256=${{ steps.fetch.outputs.amd64-sha256 }}
            com.epicgames.lore.asset.arm64.sha256=${{ steps.fetch.outputs.arm64-sha256 }}
          annotations: ${{ needs.meta.outputs.graviton-annotations }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      # provenance=false keeps this a plain manifest: buildx attaches
      # provenance as a second manifest, and an index listing only linux/amd64
      # makes an arm64 host fail the pull instead of emulating. The cost is
      # that this variant carries no provenance attestation.
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: lore-server/Dockerfile.release
          platforms: linux/amd64
          provenance: false
          labels: |
            ${{ needs.meta.outputs.labels }}
            com.epicgames.lore.asset.amd64.sha256=${{ steps.fetch.outputs.amd64-sha256 }}
          annotations: ${{ needs.meta.outputs.annotations }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Smoke test the amd64 image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: docker run --rm --platform linux/amd64 "${IMAGE}@${DIGEST}" --version

  # Native, not QEMU: the released arm64 binary is tuned past baseline and
  # emulation need not implement what it was tuned for. This runner reports
  # SVE, so it does not prove the binary runs on older arm64 — nothing does,
  # which is what the tag says.
  smoke-arm64:
    name: smoke test arm64
    needs: build
    runs-on: ubuntu-24.04-arm
    permissions:
      packages: read # Pull the index by digest
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke test the arm64 image
        env:
          DIGEST: ${{ needs.build.outputs.graviton-digest }}
        run: docker run --rm --platform linux/arm64 "${IMAGE}@${DIGEST}" --version

  # smoke-arm64 gates both variants, the amd64-only one included: a release
  # whose arm64 binary does not run is one to fix, not to publish half of.
  publish:
    name: sign and tag (${{ matrix.variant }})
    needs: [meta, build, smoke-arm64]
    runs-on: ubuntu-latest
    permissions:
      packages: write # Push the cosign signature and the release tags
      id-token: write # Federate to Fulcio for keyless signing
    strategy:
      # Signing or tagging failing for one variant should not cancel the other.
      fail-fast: false
      matrix:
        include:
          - variant: default
            media: application/vnd.oci.image.manifest.v1+json
            platforms: linux/amd64
          - variant: graviton
            media: application/vnd.oci.image.index.v1+json
            platforms: linux/amd64,linux/arm64
    env:
      JSON: ${{ matrix.variant == 'graviton' && needs.meta.outputs.graviton-json || needs.meta.outputs.json }}
      DIGEST: ${{ matrix.variant == 'graviton' && needs.build.outputs.graviton-digest || needs.build.outputs.digest }}
      VERSION: ${{ needs.meta.outputs.version }}
      EXPECT_MEDIA: ${{ matrix.media }}
      EXPECT_PLATFORMS: ${{ matrix.platforms }}
      # Commit-addressed, so it never moves; kept as a record of which commit
      # published which digest.
      STAGING_TAG: sha-${{ github.sha }}${{ matrix.variant == 'graviton' && '-graviton' || '' }}
      # Anchored on this workflow's path: a bare repository prefix would accept
      # a certificate minted by any workflow here.
      IDENTITY_REGEXP: '^https://github\.com/${{ github.repository }}/\.github/workflows/publish-loreserver-image\.yml@'
    steps:
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Inspect what was pushed
        run: docker buildx imagetools inspect "${IMAGE}@${DIGEST}"

      # Every step after this one passes just as happily with the wrong shape,
      # and the wrong shape is what makes an arm64 host fail the pull.
      - name: Check the variant is the shape it claims
        run: |
          set -euo pipefail
          manifest=$(docker buildx imagetools inspect "${IMAGE}@${DIGEST}" --format '{{json .Manifest}}')
          media=$(jq -r .mediaType <<< "${manifest}")
          if [ "${media}" != "${EXPECT_MEDIA}" ]; then
            echo "::error::${DIGEST} is ${media}, expected ${EXPECT_MEDIA} for the ${EXPECT_PLATFORMS} variant"
            exit 1
          fi
          if [ "${media}" = "application/vnd.oci.image.index.v1+json" ]; then
            # Attestations ride along as unknown/unknown, and are not platforms.
            platforms=$(jq -r '[.manifests[] | select(.platform.os != "unknown") | "\(.platform.os)/\(.platform.architecture)"] | sort | join(",")' <<< "${manifest}")
          else
            platforms=$(docker buildx imagetools inspect "${IMAGE}@${DIGEST}" --format '{{json .Image}}' \
              | jq -r '"\(.os)/\(.architecture)"')
          fi
          if [ "${platforms}" != "${EXPECT_PLATFORMS}" ]; then
            echo "::error::${DIGEST} carries ${platforms}, expected ${EXPECT_PLATFORMS}"
            exit 1
          fi
          echo "${media} carrying ${platforms}"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # By digest, not by tag: a tag can later be moved, a digest cannot.
      - name: Sign the image with cosign
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Verify the signature
        run: |
          set -euo pipefail
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity-regexp "${IDENTITY_REGEXP}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            > /dev/null
          echo "signature verified"

      # --prefer-index=false is load-bearing: given a lone plain manifest,
      # `imagetools create` otherwise rewraps it in an index and the digest
      # changes with it. Rehearsed on the staging tag, which nothing consumes,
      # so a buildx that stops preserving the digest moves that tag and not
      # `latest`.
      - name: Prove the copy preserves the digest
        run: |
          set -euo pipefail
          create=(docker buildx imagetools create)
          if [ "${EXPECT_MEDIA}" != "application/vnd.oci.image.index.v1+json" ]; then
            create+=(--prefer-index=false)
          fi
          "${create[@]}" --tag "${IMAGE}:${STAGING_TAG}" "${IMAGE}@${DIGEST}"
          resolved=$(docker buildx imagetools inspect "${IMAGE}:${STAGING_TAG}" \
            --format '{{json .Manifest}}' | jq -r .digest)
          if [ "${resolved}" != "${DIGEST}" ]; then
            echo "::error::copying changed the digest (${DIGEST} -> ${resolved}); refusing to move the release tags off the signed digest"
            exit 1
          fi
          echo "copy is digest-preserving"

      # Each tag is re-resolved after, so one off the signed digest fails.
      - name: Promote the signed digest to the release tags
        run: |
          set -euo pipefail
          create=(docker buildx imagetools create)
          if [ "${EXPECT_MEDIA}" != "application/vnd.oci.image.index.v1+json" ]; then
            create+=(--prefer-index=false)
          fi
          while IFS= read -r tag; do
            create+=(--tag "${tag}")
          done < <(jq -r '.tags[]' <<< "$JSON")
          "${create[@]}" "${IMAGE}@${DIGEST}"
          while IFS= read -r tag; do
            resolved=$(docker buildx imagetools inspect "${tag}" \
              --format '{{json .Manifest}}' | jq -r .digest)
            if [ "${resolved}" != "${DIGEST}" ]; then
              echo "::error::${tag} resolved to ${resolved}, not the signed ${DIGEST}"
              exit 1
            fi
            echo "${tag} -> ${resolved}"
          done < <(jq -r '.tags[]' <<< "$JSON")

      - name: Summarise what was published
        env:
          VARIANT: ${{ matrix.variant }}
          AMD64_SHA256: ${{ needs.build.outputs.amd64-sha256 }}
          ARM64_SHA256: ${{ needs.build.outputs.arm64-sha256 }}
        run: |
          set -euo pipefail
          {
            echo "## Published \`${IMAGE}\` (${VARIANT}) from release \`${VERSION}\`"
            echo ""
            echo "Digest: \`${DIGEST}\`"
            echo ""
            if [ "${VARIANT}" = "graviton" ]; then
              echo "Platforms: linux/amd64 (baseline), linux/arm64 (tuned for Graviton3+ — will not run on older arm64)"
              echo ""
              echo "Release assets packaged:"
              echo "- \`loreserver-${VERSION}-x86_64-unknown-linux-gnu.tar.gz\` (sha256 \`${AMD64_SHA256}\`)"
              echo "- \`loreserver-${VERSION}-aarch64-unknown-linux-gnu-${ARM64_TUNING}.tar.gz\` (sha256 \`${ARM64_SHA256}\`)"
            else
              echo "Platforms: linux/amd64 only, as a plain manifest so an arm64 host emulates it rather than failing the pull"
              echo ""
              echo "Release assets packaged:"
              echo "- \`loreserver-${VERSION}-x86_64-unknown-linux-gnu.tar.gz\` (sha256 \`${AMD64_SHA256}\`)"
            fi
            echo ""
            echo "Tags:"
            jq -r '.tags[] | "- `" + . + "`"' <<< "$JSON"
            echo "- \`${IMAGE}:${STAGING_TAG}\` (staging tag the signature was made against)"
            echo ""
            echo "Verify the signature with:"
            echo ""
            echo '```sh'
            echo "cosign verify ${IMAGE}@${DIGEST} \\"
            echo "  --certificate-identity-regexp '${IDENTITY_REGEXP}' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
