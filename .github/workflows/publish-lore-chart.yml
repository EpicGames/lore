name: Publish Lore Helm chart

# Publishes contrib/helm as a signed OCI chart at ghcr.io/epicgames/lore/charts/lore.
# On its own `lore-chart-vX.Y.Z` tags rather than server releases, so a chart-only
# fix ships without waiting for a loreserver release. The tag must match the
# `version` in Chart.yaml.
#
# The gates below live in this file, so they bind only runs of the reviewed
# file. Someone who can push a tag can run an edited copy, `environment:` line
# and all removed, so the tag ruleset limiting who may create lore-chart-v*
# tags is the control that matters. The chart-release environment (deployment
# rule: lore-chart-v* tags, required reviewers) gates the reviewed path.
on:
  push:
    tags: ["lore-chart-v*"]
  # Proves the workflow from any branch. It publishes `X.Y.Z-dev.<run>.<attempt>`
  # to a separate charts-dev package, so a test build never sits beside the
  # releases or outranks them for `--devel` and semver-range users.
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-lore-chart-${{ github.ref }}
  cancel-in-progress: false

env:
  HELM_VERSION: v3.19.5
  CRANE_VERSION: v0.22.1

jobs:
  package:
    name: resolve version and package
    runs-on: ubuntu-latest
    permissions:
      contents: read # Check out the chart
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      chart: ${{ steps.version.outputs.chart }}
    defaults:
      run:
        working-directory: contrib/helm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: ${{ env.HELM_VERSION }}

      - id: version
        name: Resolve and validate the chart version
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          semver='[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?'
          chart_version=$(yq -r .version Chart.yaml)
          if ! printf '%s' "${chart_version}" | grep -qE "^${semver}$"; then
            echo "::error::Chart.yaml version '${chart_version}' is not semver"
            exit 1
          fi
          if [ "${EVENT}" = "push" ]; then
            if ! printf '%s' "${REF_NAME}" | grep -qE "^lore-chart-v${semver}$"; then
              echo "::error::'${REF_NAME}' is not a chart release tag of the form lore-chart-v1.2.3"
              exit 1
            fi
            if [ "${REF_NAME#lore-chart-v}" != "${chart_version}" ]; then
              echo "::error::tag ${REF_NAME} does not match Chart.yaml version ${chart_version}; bump Chart.yaml or retag"
              exit 1
            fi
            # Anyone who can push a tag can put it on any commit; only reviewed
            # code becomes a release. "behind" or "identical" means the commit
            # is in the default branch's history.
            status=$(gh api "repos/{owner}/{repo}/compare/${DEFAULT_BRANCH}...${GITHUB_SHA}" --jq .status)
            case "${status}" in
              behind | identical) ;;
              *)
                echo "::error::${REF_NAME} points at ${GITHUB_SHA}, which is not on ${DEFAULT_BRANCH} (${status})"
                exit 1
                ;;
            esac
            version="${chart_version}"
            release=true
            chart=ghcr.io/epicgames/lore/charts/lore
          else
            # A full re-run repackages, so the attempt keeps it from colliding
            # with the first try. Re-running only the failed publish job reuses
            # this version and artifact, which the publish job allows.
            version="${chart_version}-dev.${RUN_ID}.${RUN_ATTEMPT}"
            release=false
            chart=ghcr.io/epicgames/lore/charts-dev/lore
          fi
          # `helm push` appends the chart name to the registry path.
          {
            echo "version=${version}"
            echo "release=${release}"
            echo "chart=${chart}"
          } >> "$GITHUB_OUTPUT"
          echo "version=${version} release=${release}"

      - name: Lint
        run: helm lint .

      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: helm package . --version "${VERSION}" --destination "${RUNNER_TEMP}/chart"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chart
          path: ${{ runner.temp }}/chart/lore-${{ steps.version.outputs.version }}.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: push, sign and tag
    needs: package
    runs-on: ubuntu-latest
    # Releases only: a dispatch publishes to charts-dev and needs no approval.
    # An empty name means no environment.
    environment: ${{ needs.package.outputs.release == 'true' && 'chart-release' || '' }}
    permissions:
      packages: write # Push the chart, its signature and its version tag
      id-token: write # Federate to Fulcio for keyless signing
    # `helm push` always tags, so it pushes here first; the chart reaches GHCR
    # by digest and gets its version tag only once signed.
    services:
      staging:
        image: registry:3
        ports:
          - 5000:5000
    env:
      VERSION: ${{ needs.package.outputs.version }}
      CHART: ${{ needs.package.outputs.chart }}
      # Exact, ref included: a pattern that ends at `@` would also accept a
      # signature from a dispatch on any unreviewed branch.
      CERT_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/publish-lore-chart.yml@${{ github.ref }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: chart
          path: chart

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: ${{ env.HELM_VERSION }}

      # Also logs crane in to ghcr.io with the job's token.
      - uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7
        with:
          version: ${{ env.CRANE_VERSION }}

      - id: stage
        name: Push to the staging registry
        run: |
          set -euo pipefail
          helm push "chart/lore-${VERSION}.tgz" oci://localhost:5000/charts --plain-http
          digest=$(crane digest "localhost:5000/charts/lore:${VERSION}")
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "staged ${digest}"

      # Chart versions are meant to be immutable, and OCI tags are not: pushing
      # the same version again would silently replace what people installed.
      # The same digest is fine: that is a re-run of this job, and pushing the
      # same artifact again reproduces it byte for byte.
      - name: Refuse a version already published at another digest
        env:
          DIGEST: ${{ steps.stage.outputs.digest }}
        run: |
          set -euo pipefail
          if existing=$(crane digest "${CHART}:${VERSION}" 2>&1); then
            if [ "${existing}" != "${DIGEST}" ]; then
              echo "::error::${CHART}:${VERSION} is already published at ${existing}; bump the chart version"
              exit 1
            fi
            echo "::notice::${CHART}:${VERSION} is already this digest; re-running the remaining steps"
            exit 0
          fi
          # Fail closed: only "not there" counts as absent, never a 5xx or a
          # rate limit. GHCR answers DENIED for a package that does not exist
          # yet; one that exists but this token cannot read could not be
          # pushed to either, so that cannot overwrite anything.
          case "${existing}" in
            *MANIFEST_UNKNOWN* | *NAME_UNKNOWN* | *DENIED*) echo "not published yet" ;;
            *)
              echo "::error::could not check whether ${CHART}:${VERSION} exists: ${existing}"
              exit 1
              ;;
          esac

      # A copy by digest, so nothing in GHCR is tagged yet.
      - name: Copy the chart to GHCR by digest
        env:
          DIGEST: ${{ steps.stage.outputs.digest }}
        run: |
          set -euo pipefail
          crane copy "localhost:5000/charts/lore@${DIGEST}" "${CHART}@${DIGEST}"
          crane manifest "${CHART}@${DIGEST}" > /dev/null
          echo "copied ${CHART}@${DIGEST}"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # By digest: a tag can later be moved, a digest cannot.
      - name: Sign the chart with cosign
        env:
          DIGEST: ${{ steps.stage.outputs.digest }}
        run: cosign sign --yes "${CHART}@${DIGEST}"

      - name: Verify the signature
        env:
          DIGEST: ${{ steps.stage.outputs.digest }}
        run: |
          set -euo pipefail
          cosign verify "${CHART}@${DIGEST}" \
            --certificate-identity "${CERT_IDENTITY}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            > /dev/null
          echo "signature verified"

      # Re-resolved after, so a tag off the signed digest fails the run.
      - name: Tag the signed digest with the chart version
        env:
          DIGEST: ${{ steps.stage.outputs.digest }}
        run: |
          set -euo pipefail
          crane tag "${CHART}@${DIGEST}" "${VERSION}"
          resolved=$(crane digest "${CHART}:${VERSION}")
          if [ "${resolved}" != "${DIGEST}" ]; then
            echo "::error::${CHART}:${VERSION} resolved to ${resolved}, not the signed ${DIGEST}"
            exit 1
          fi
          echo "${CHART}:${VERSION} -> ${resolved}"

      # What a user does: helm itself, with no credentials. setup-crane logged
      # in to ghcr.io, and helm would otherwise borrow that login and pass even
      # if the package were private.
      - name: Pull the chart back anonymously with helm
        run: |
          set -euo pipefail
          anon=$(mktemp -d)
          DOCKER_CONFIG="${anon}" HELM_REGISTRY_CONFIG="${anon}/registry.json" \
            helm show chart "oci://${CHART}" --version "${VERSION}"

      - name: Summarise what was published
        env:
          DIGEST: ${{ steps.stage.outputs.digest }}
          RELEASE: ${{ needs.package.outputs.release }}
        run: |
          set -euo pipefail
          {
            echo "## Published \`${CHART}:${VERSION}\`"
            echo ""
            if [ "${RELEASE}" != "true" ]; then
              echo "A test build from a manual dispatch, in the separate charts-dev package; not a release."
              echo ""
            fi
            echo "Digest: \`${DIGEST}\`"
            echo ""
            echo "Install with:"
            echo ""
            echo '```sh'
            echo "helm install lore oci://${CHART} --version ${VERSION}"
            echo '```'
            echo ""
            echo "Verify the signature with:"
            echo ""
            echo '```sh'
            echo "cosign verify ${CHART}@${DIGEST} \\"
            echo "  --certificate-identity '${CERT_IDENTITY}' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
