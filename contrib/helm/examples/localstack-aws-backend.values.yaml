# Example: exercise the AWS S3 + DynamoDB backend against LocalStack, with no AWS
# account. Useful for validating the backend wiring in CI or on a dev cluster.
#
# This is a TEST configuration. LocalStack emulates the S3 and DynamoDB APIs (its
# DynamoDB is AWS's own DynamoDBLocal engine, so key-schema validation is faithful),
# but it does not reproduce IAM, throttling, cross-region behaviour, or performance.
# Use it to prove configuration and API wiring, not to qualify a production backend.
#
# 1. Deploy LocalStack with S3 + DynamoDB, reachable at
#    http://localstack.<namespace>.svc.cluster.local:4566
#
# 2. Create the bucket and the four tables, matching contrib/aws/storage.tf. Every
#    table key is binary (B); the locks table also needs its three indexes.
#
#    aws s3api create-bucket --bucket lore-fragments
#
#    aws dynamodb create-table --table-name lore-fragments \
#      --attribute-definitions AttributeName=hash,AttributeType=B \
#                              AttributeName=repository_context,AttributeType=B \
#      --key-schema AttributeName=hash,KeyType=HASH \
#                   AttributeName=repository_context,KeyType=RANGE \
#      --billing-mode PAY_PER_REQUEST
#
#    aws dynamodb create-table --table-name lore-fragment-state \
#      --attribute-definitions AttributeName=hash,AttributeType=B \
#      --key-schema AttributeName=hash,KeyType=HASH \
#      --billing-mode PAY_PER_REQUEST
#
#    aws dynamodb create-table --table-name lore-mutable \
#      --attribute-definitions AttributeName=repository_id,AttributeType=B \
#                              AttributeName=key,AttributeType=B \
#      --key-schema AttributeName=repository_id,KeyType=HASH \
#                   AttributeName=key,KeyType=RANGE \
#      --billing-mode PAY_PER_REQUEST
#
#    aws dynamodb create-table --table-name lore-locks \
#      --attribute-definitions AttributeName=hash,AttributeType=B \
#                              AttributeName=repositoryBranch,AttributeType=B \
#                              AttributeName=ownerId,AttributeType=S \
#                              AttributeName=repository,AttributeType=B \
#                              AttributeName=branch,AttributeType=B \
#                              AttributeName=description,AttributeType=S \
#      --key-schema AttributeName=hash,KeyType=HASH \
#                   AttributeName=repositoryBranch,KeyType=RANGE \
#      --global-secondary-indexes \
#        'IndexName=owner-repo-branch,KeySchema=[{AttributeName=ownerId,KeyType=HASH},{AttributeName=repositoryBranch,KeyType=RANGE}],Projection={ProjectionType=ALL}' \
#        'IndexName=repo-branch,KeySchema=[{AttributeName=repository,KeyType=HASH},{AttributeName=branch,KeyType=RANGE}],Projection={ProjectionType=ALL}' \
#        'IndexName=repo-branch-description,KeySchema=[{AttributeName=repositoryBranch,KeyType=HASH},{AttributeName=description,KeyType=RANGE}],Projection={ProjectionType=ALL}' \
#      --billing-mode PAY_PER_REQUEST
#
# 3. helm install lore . -f examples/localstack-aws-backend.values.yaml

image:
  repository: ghcr.io/epicgames/lore/loreserver
  tag: ""  # empty = the chart's appVersion

topology:
  mode: single

# No local state at all — everything lives in S3 + DynamoDB.
data:
  persistence:
    enabled: false

# Static dummy credentials: LocalStack accepts anything, but the AWS SDK refuses to
# sign a request without them. Use a real Secret + IRSA against real AWS instead.
extraEnv:
  - name: AWS_ACCESS_KEY_ID
    value: "test"
  - name: AWS_SECRET_ACCESS_KEY
    value: "test"
  - name: AWS_REGION
    value: "us-east-1"

service:
  type: ClusterIP

config:
  extra: |
    [immutable_store]
    mode = "aws"

    [mutable_store]
    mode = "aws"

    [lock_store]
    mode = "aws"

    # s3_force_path_style is required: LocalStack does not serve virtual-host-style
    # bucket subdomains. dynamodb_endpoint_url must be set on EVERY store section —
    # the immutable store talks to DynamoDB too (fragments + fragment-state tables).
    [plugins.aws.immutable_store]
    s3_bucket = "lore-fragments"
    s3_endpoint_url = "http://localstack.lore.svc.cluster.local:4566"
    s3_region = "us-east-1"
    s3_force_path_style = true
    dynamodb_fragments_table = "lore-fragments"
    dynamodb_fragment_state_table = "lore-fragment-state"
    dynamodb_endpoint_url = "http://localstack.lore.svc.cluster.local:4566"
    dynamodb_region = "us-east-1"

    [plugins.aws.mutable_store]
    dynamodb_table = "lore-mutable"
    dynamodb_endpoint_url = "http://localstack.lore.svc.cluster.local:4566"
    dynamodb_region = "us-east-1"

    [plugins.aws.lock_store]
    dynamodb_table = "lore-locks"
    dynamodb_endpoint_url = "http://localstack.lore.svc.cluster.local:4566"
    dynamodb_region = "us-east-1"
