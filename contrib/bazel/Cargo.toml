[workspace]
resolver = "2"
members = ["crates/rbe-lore", "crates/rbe-proto", "crates/rbe-server", "crates/rbe-worker"]
# Its own workspace, built from within contrib/bazel: a remote execution server on Lore's storage
# API, built and run on its own and not part of what the Lore workspace builds and tests. It
# reaches the Lore crates by path and pins its dependencies in a committed `Cargo.lock`.

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

# Lore's own lint table, which a workspace of its own does not inherit.
[workspace.lints.rust]
future_incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)'] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
checked_conversions = "warn"
dbg_macro = "warn"
debug_assert_with_mut_call = "warn"
doc_markdown = "warn"
enum_glob_use = "warn"
exit = "warn"
expl_impl_clone_on_copy = "warn"
explicit_deref_methods = "warn"
explicit_into_iter_loop = "warn"
fallible_impl_from = "warn"
filter_map_next = "warn"
flat_map_option = "warn"
float_cmp_const = "warn"
fn_params_excessive_bools = "warn"
implicit_clone = "warn"
imprecise_flops = "warn"
inefficient_to_string = "warn"
invalid_upcast_comparisons = "warn"
large_digit_groups = "warn"
large_futures = "warn"
large_stack_arrays = "warn"
large_types_passed_by_value = "warn"
linkedlist = "warn"
lossy_float_literal = "warn"
macro_use_imports = "warn"
manual_ok_or = "warn"
map_err_ignore = "warn"
map_unwrap_or = "warn"
match_same_arms = "warn"
match_wild_err_arm = "warn"
match_wildcard_for_single_variants = "warn"
mem_forget = "warn"
mut_mut = "warn"
mutex_integer = "warn"
needless_continue = "warn"
needless_for_each = "warn"
option_option = "warn"
path_buf_push_overwrite = "warn"
ptr_as_ptr = "warn"
rc_mutex = "warn"
ref_option_ref = "warn"
rest_pat_in_fully_bound_structs = "warn"
same_functions_in_if_condition = "warn"
semicolon_if_nothing_returned = "warn"
single_match_else = "warn"
string_add_assign = "warn"
string_add = "warn"
string_lit_as_bytes = "warn"
todo = "warn"
trait_duplication_in_bounds = "warn"
unimplemented = "warn"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"
unused_async = "warn"
unused_self = "warn"
verbose_file_reads = "warn"
zero_sized_map_values = "warn"

[workspace.dependencies]
rbe-lore = { path = "crates/rbe-lore" }
rbe-proto = { path = "crates/rbe-proto" }

lore = { path = "../../lore" }
lore-base = { path = "../../lore-base" }
lore-macro = { path = "../../lore-macro" }
lore-revision = { path = "../../lore-revision" }

anyhow = "1.0.103"
bytes = "1.11"
clap = { version = "4.5", features = ["derive"] }
dashmap = "6.1"
futures = "0.3"
hex = "0.4"
libc = "0.2"
prost = "0.14"
prost-types = "0.14"
sha2 = "0.11"
tokio = { version = "1.47", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.18", features = ["v4"] }
zstd = "0.13"

# Same vendored crates the Lore workspace patches in. A patch table belongs to a workspace root, so
# standing outside that workspace means restating it: the Lore crates reach lore-transport, which
# is written against the vendored quinn-proto, and lore-revision, whose view and ignore filters
# need the vendored glob-match's `**` matching.
[patch.crates-io]
quinn-proto = { path = "../../vendor/quinn-proto" }
glob-match = { path = "../../vendor/glob-match" }
