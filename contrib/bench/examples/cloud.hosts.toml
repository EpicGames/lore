# Two cloud instances in one subnet and placement group, for example on AWS, each with a local NVMe
# (instance store) volume mounted on /bench before bootstrap.sh ran. The instances reach each other
# at their private addresses; the operator reaches both at their public addresses, as the image's
# default user, whose key is the harness's (imported as the instances' key pair). Copy a spec,
# point its target.inventory at this file, and replace the addresses with your instances'.
[client]
ip = "10.0.1.10"                 # private: the server shapes its traffic to this address
ssh = "ubuntu@203.0.113.10"      # public
data = "/bench"
notes = "instance type, region and volume, recorded with the results"

[server]
ip = "10.0.1.20"                 # private: the client reaches SSH, P4 and Lore here
ssh = "ubuntu@203.0.113.20"
data = "/bench"
notes = "instance type, region and volume, recorded with the results"
