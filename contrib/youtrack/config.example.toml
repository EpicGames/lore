# Copy outside the monitored repository. Relative paths use this file's directory.

[bridge]
repository = "/var/lib/lore-youtrack/cache"
database = "/var/lib/lore-youtrack/state/outbox.sqlite3"
lore_binary = "/usr/local/bin/lore"
branches = ["main"]
poll_seconds = 30
lore_timeout = 60
scan_limit = 1000
send_limit = 100

[youtrack]
# Copy the Resource URL generated by the Generic VCS integration in YouTrack.
receiver_url = "https://youtrack.example.com/api/vcsHooksReceiver/generic/519-6"
signature_env = "LORE_YOUTRACK_SIGNATURE"
# Alternatively: signature_file = "/etc/lore-youtrack/signature"
request_timeout = 15
allow_http_loopback = false

# Optional read-only reconciliation. Use the same URL template as YouTrack.
# commit_url_template = "https://lore-viewer.example.com/game/revision/$hash$"
# read_token_env = "LORE_YOUTRACK_READ_TOKEN"
# Alternatively: read_token_file = "/etc/lore-youtrack/read-token"
# Include all projects connected to this receiver.
project_keys = ["GAME"]

# Replace the key with the exact created-by identity from Lore revision metadata.
[authors."lore-user-id"]
user_name = "developer"
email = "developer@example.com"
