[server.auth]
# Each authentik application has its own issuer. Both sign with the same key, so
# the server finds that key through the first issuer's discovery document.
jwt_issuer = [
    "http://localhost:9000/application/o/lore-cli/",
    "http://localhost:9000/application/o/lore-ci/",
]
jwt_audience = ["https://localhost"]
# Tier 2: each entry of the exchanged token's `resources` claim is
# {resource_id, permission}, with resource_id "urc-<repository ID>".
resource_claim = "resources"

[server.auth.oidc]
client_id = "lore-cli"
# authentik adds the `lore` scope mapping's claims, `aud` and `identity`
# among them, only when the client requests the scope.
scopes = ["openid", "profile", "lore"]
client_credentials_scopes = ["lore"]
resource_template = "https://localhost/partitions/{id}"
# The exchange service in ../exchange/. It signs with keys of its own, which the
# server finds through the service's discovery document.
token_exchange_issuer = "http://localhost:8190"

[immutable_store.local]
path = "/tmp/lore-oidc-demo/authentik-tier2-server"

[mutable_store.local]
path = "/tmp/lore-oidc-demo/authentik-tier2-server"

[telemetry.logger]
format = "text"
