# =============================================================================
# Lore Server GitHub Actions Configuration
# =============================================================================
# This configuration is used for CI testing in GitHub Actions.

[server.grpc]
port = 41338

# No [server.quic.certificate] or [server.quic_internal.certificate]: with
# verify_client_certs = false the certificate only has to satisfy the TLS
# handshake, and clients reach both endpoints over the unvalidated `lore://` /
# `quic://` schemes. The server generates an ephemeral self-signed certificate
# per endpoint at startup, so a test run needs no certificate files at all.
[server.quic]
port = 41338

[server.quic_internal]
enabled = true
verify_client_certs = false

[server.http]
presigned_url_hmac_key = "32d0bd7711276da5a4d73e1211ba3884ad1819aa0b4727b8ee5d695e9c3199de"

# =============================================================================
# Store Configuration
# =============================================================================

[immutable_store]
mode = "local"

[mutable_store]
mode = "local"

[lock_store]
mode = "local"

# =============================================================================
# Local Store Configuration (Predefined Type)
# =============================================================================

[immutable_store.local]
path = "./"
flush_delay_seconds = 10

[mutable_store.local]
path = "./"
flush_delay_seconds = 10

# =============================================================================
# Telemetry Configuration
# =============================================================================

[telemetry.logger]
format = "text"

# =============================================================================
# Notification Configuration
# =============================================================================

[notification]
mode = "local"

# =============================================================================
# Other Features Configuration
# =============================================================================

[feature]
history_step_size = 10
