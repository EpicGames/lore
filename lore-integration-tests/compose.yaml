# Note: anything you rely on for running integration tests
# should also have a non-docker equivalent in scripts/actions/test-integration.sh
name: integration-tests

services:
  # The S3 stand-in. RustFS rather than MinIO because MinIO's community edition
  # no longer publishes images; see docs/developing/decisions/00020-s3-test-double.md.
  # Pinned by digest so the fixture is reproducible and a bump is a reviewed
  # change, the way the workflows pin their actions. Stricter than the other
  # services here on purpose: this is the one whose 1.0 is recent enough that
  # the tag may still move. The digest covers amd64 and arm64.
  rustfs:
    image: rustfs/rustfs:1.0.0@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - RUSTFS_ACCESS_KEY=lorelocal
      - RUSTFS_SECRET_KEY=lorelocal
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
    # The bucket lives in tmpfs, so the store is wiped on restart the way
    # DynamoDB Local's -inMemory wipes the tables. The mode is widened because
    # the container runs as uid 10001 and tmpfs mounts come up root-owned 0755.
    tmpfs:
      - /data:mode=1777
      - /logs:mode=1777
  dynamodb:
    image: amazon/dynamodb-local
    ports:
      - "9090:9090"
    init: true
    restart: on-failure
    environment:
      - AWS_ACCESS_KEY_ID=lorelocal
      - AWS_SECRET_ACCESS_KEY=lorelocal
      - AWS_REGION=us-east-1
    command: "-jar DynamoDBLocal.jar -port 9090 -inMemory -sharedDb"
  consul-server:
    image: hashicorp/consul:latest
    container_name: consul-server
    ports:
      - "8500:8500"
    volumes:
      - ./consul-data:/consul/data
    command: agent -server -bootstrap-expect=1 -data-dir=/consul/server/data -node=consul-server-1 -client=0.0.0.0 -ui
  consul-node-1:
    depends_on:
      - consul-server
    image: hashicorp/consul:latest
    container_name: consul-node-1
    volumes:
      - ./consul-data:/consul/data
    command: agent -data-dir=/consul/node-1/data -node=consul-node-1 -retry-join=consul-server
