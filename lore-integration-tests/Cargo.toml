[package]
name = "lore-integration-tests"
version = "0.1.0"
edition = "2024"
publish = false
# One target for the whole suite, declared below. Autodiscovery would compile
# every file in tests/ as a test binary of its own, and each is a module of that
# suite rather than a crate root.
autotests = false

# The suite runs against the services in compose.yaml, so every test in it is
# behind `integration_tests`. Naming the feature here keeps a build that does not
# enable it from linking the target at all, rather than linking a harness that
# holds no tests.
[[test]]
name = "integration"
path = "tests/integration.rs"
required-features = ["integration_tests"]

# Its own target rather than a module of the suite: it installs a process-wide GC event sink
# provider, which takes the first registration and would otherwise race the suite's own.
# Needs no service from compose.yaml, so it is not behind `integration_tests`.
[[test]]
name = "store_gc_trigger"
path = "tests/store_gc_trigger_test.rs"

# Its own target: whether a process retains its stores is read once per process, so each test
# runs in a copy of this binary started with `LORE_STORE_RETAIN` set or removed. Needs no service
# from compose.yaml, so it is not behind `integration_tests`.
[[test]]
name = "store_retention"
path = "tests/store_retention_test.rs"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
aws-sdk-dynamodb = { version = "1.92.0", default-features = false, features = ["rt-tokio"] }
aws-sdk-s3 = { version = "1.104.0", default-features = false, features = ["rt-tokio"] }
bytes = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
ring = { workspace = true }
serde_json = { workspace = true }
rs-consul = "0.13.0"
rustls = { workspace = true, optional = true }
serde_dynamo = { version = "4.2.14", features = ["aws-sdk-dynamodb+1"] }
tokio = { workspace = true }
tokio-stream = { workspace = true, optional = true }
tonic = { workspace = true, optional = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
zerocopy = { workspace = true }
lore = { workspace = true }
lore-base = { workspace = true }
lore-storage = { workspace = true }
lore-aws = { workspace = true }
lore-revision = { workspace = true }
lore-hashicorp = { workspace = true }
lore-proto = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
ctor = { workspace = true }
lore = { workspace = true, features = ["test-util"] }
lore-base = { workspace = true, features = ["test-util"] }
lore-server = { workspace = true, features = ["test-util"] }
lore-storage = { workspace = true, features = ["test-util"] }
# Here rather than under [dependencies]: a normal dependency's features apply to every build that
# includes this package, so a release build of the workspace would compile lore-revision's test
# access into every binary.
lore-revision = { workspace = true, features = ["test-util"] }
lore-transport = { workspace = true, features = ["test-util"] }
rcgen = { workspace = true }
serde = { workspace = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
libc = { workspace = true }
lore-fuse = { path = "../lore-fuse", features = ["test-util"] }

[features]
integration_tests = ["lore-server/integration_tests"]
grpc_integration_tests = ["dep:tokio-stream", "dep:tonic"]

[lints]
workspace = true
