[package]
name = "lore-desktop"
edition = "2024"
version.workspace = true
publish = false
description = "Lore desktop client"

[dependencies]
eframe = "0.37.0"
egui_extras = "0.37.0"
lore = { workspace = true }
parking_lot = { workspace = true }

[dev-dependencies]

[[bin]]
name = "lore-desktop"
path = "src/main.rs"
test = false
doctest = false
bench = false

[lib]
name = "lore_desktop"
path = "src/lib.rs"
test = false
doctest = false

[[test]]
name = "unit"
path = "tests/unit/main.rs"

[lints]
workspace = true
