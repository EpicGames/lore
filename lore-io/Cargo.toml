[package]
name = "lore-io"
edition = "2024"
version.workspace = true
publish = false

[lib]
name = "lore_io"
test = false

[dependencies]
bytes = { workspace = true }
lore-macro = { workspace = true }
parking_lot = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = { workspace = true }

# For the uring backend's eventfd and poll, the thread disk priority, the error codes that tell
# a mount point, and the clone backends' `clonefile`, `fcopyfile`, `FICLONE`, `statfs` and `statvfs`.
[target.'cfg(target_family = "unix")'.dependencies]
libc = { workspace = true }

# Windows only, and load-bearing rather than convenience: handles opened here are overlapped, so
# that concurrent operations on one of them are not serialized by the I/O manager, and `std` has no
# positional call that is defined against such a handle. The data path issues `ReadFile`/`WriteFile`
# with its own `OVERLAPPED` instead. windows-sys is the workspace's Win32 binding already.
[target.'cfg(target_family = "windows")'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    # `CreateEventW` takes a `SECURITY_ATTRIBUTES`, so its module is only compiled with this. The
    # crate built without it while the workspace happened to enable it elsewhere; naming it here is
    # what makes `cargo build -p lore-io` stand on its own.
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    # `FSCTL_DUPLICATE_EXTENTS_TO_FILE` and the integrity and sparse controls the ReFS clone
    # backend issues with it, and the reparse-point controls the clone copies a link or
    # junction with.
    "Win32_System_Ioctl",
    # For IO_REPARSE_TAG_MOUNT_POINT, which tells a directory that a rename would move without
    # the files it leads to.
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    # For FILE_SKIP_COMPLETION_PORT_ON_SUCCESS and FILE_SKIP_SET_EVENT_ON_HANDLE, which the
    # completion-port backend needs to own a synchronous completion rather than race the reaper
    # for it.
    "Win32_System_WindowsProgramming",
] }

# The library depends on no async runtime: its futures suspend on wakers alone. tokio is here for
# the tests' own runtime, and futures drives the case that proves the point without one. lore-base
# is here for its `#[global_allocator]`: the read path's design rests on the process allocator
# caching spans per thread, so a benchmark on glibc malloc measures a different program than the
# one that ships. lore-io itself is here with `test-util`, which opens its internals to the unit
# tests in tests/unit. Dev-only, so the library's own dependency graph is unchanged.
[dev-dependencies]
futures = { workspace = true }
lore-base = { workspace = true, features = ["test-util"] }
lore-io = { workspace = true, features = ["test-util"] }
tokio = { workspace = true }

# A named pipe is the only thing a unit test can make defer on demand, and deferring is the whole
# of what the completion-port backend is for. See `overlapped_pipe_pair` in tests/unit/iocp.rs. The
# conformance suite names `ERROR_SHARING_VIOLATION` and `FILE_SHARE_READ` when it pins the share
# modes, hence the foundation and filesystem modules here as well. The listing tests name the
# reparse tags of a symbolic link, a junction and a deduplicated file, which the
# `Win32_System_SystemServices` module holds.
[target.'cfg(target_family = "windows")'.dev-dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_SystemServices",
] }

[features]
test-util = []

[lints]
workspace = true
