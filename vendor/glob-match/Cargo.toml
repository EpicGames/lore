# Vendored from crates.io glob-match 0.2.1 (MIT, Devon Govett).
#
# Vendored to fix a `**` backtracking defect: matching a literal character
# cleared the globstar backtrack point, so a `**` could never be resumed to skip
# a path segment it had already entered. `**/*b` did not match `b/b`, and
# `**/*/a` did not match `d/a`. Lore's filter needs `**` to be correct because
# gitignore documents these forms and the ignore/view filters accept them
# verbatim; the defect made lore silently fail to exclude matching paths.
#
# The matcher also reads a glob as git reads a gitignore pattern, where upstream
# does not: only `/` separates components, a bracket expression never matches
# a separator, `**` is a globstar only as a whole component, and a leading `!`
# is a literal.
#
# A path that does not start with the glob's literal prefix and end with its
# literal suffix is rejected before the matcher runs, so against `a/**/*.ext` a
# path that does not start with `a/` and end with `.ext` runs neither matching
# pass.
#
# The changes are in src/lib.rs, marked with `LORE:` notes, and their tests are
# marked the same in src/lib.rs, tests/doublestar.rs and tests/literal_ends.rs.
# Upstream the `**` backtracking fix.
#
# Benches and their dev-dependencies are dropped; only the library is used.
[package]
edition = "2021"
name = "glob-match"
version = "0.2.1"
authors = ["Devon Govett <devongovett@gmail.com>"]
description = "An extremely fast glob matcher"
readme = "README.md"
license = "MIT"
