[package]
name = "lore-base"
edition = "2024"
version.workspace = true
publish = false

[lib]
name = "lore_base"

# Writes the build version into finished artifacts; see src/version.rs.
[[bin]]
name = "lore-stamp"
path = "src/bin/lore-stamp.rs"

[features]
trace_log = []
# The shared test temp-directory helper in src/test_util.rs. Crates whose tests
# need scratch space on disk enable it from their dev-dependencies, so it stays
# out of every normal build.
test-util = ["dep:tempfile"]
# Tells build.rs to compile the rpmalloc C code with -mcpu=neoverse-512tvb.
neoverse-512tvb = []

[dependencies]
# allocator
backtrace = { version = "0.3.75", default-features = false, features = ["std"] }
libc = { workspace = true }
parking_lot = { workspace = true }
zerocopy = { workspace = true }

# directories
directories = { workspace = true }

# error
hex = { workspace = true }
thiserror = { workspace = true }
lore-error-set = { workspace = true }

# types
bitflags = { workspace = true }
blake3 = { workspace = true }
bytes = { workspace = true }
rand = { workspace = true }
# Built only when `test-util` is on, so it stays out of normal builds. It is a
# normal optional dependency rather than a dev-dependency because a dependent
# enabling the feature compiles lore-base normally, and a normal build cannot see
# dev-dependencies.
tempfile = { workspace = true, optional = true }
serde = { workspace = true }
uuid = { workspace = true, features = ["zerocopy"] }

# log
chrono = { workspace = true }

# runtime
lore-io = { workspace = true }
pin-project = { workspace = true }
tokio = { workspace = true }

# fs
[target.'cfg(target_family = "windows")'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Storage_ProjectedFileSystem", "Win32_Storage_FileSystem", "Win32_System_Diagnostics", "Win32_System_Diagnostics_Debug", "Win32_System_IO", "Win32_Security"] }

[dev-dependencies]
# The integration tests and the lore-stamp tests are built against the library as other crates
# see it, without the `test` cfg, so they reach test_util through the feature instead.
lore-base = { path = ".", features = ["test-util"] }
# The non-self-describing format the identifier types must round-trip through.
bitcode = { workspace = true }
# This crate's own tests reach test_util through the `test` arm of its cfg, which
# bypasses the `test-util` feature and so does not pull in the optional
# dependency above.
tempfile = { workspace = true }
serde_json = { workspace = true, features = ["std"] }

[build-dependencies]
cc = "1.2.32"
