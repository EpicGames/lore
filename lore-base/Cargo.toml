[package]
name = "lore-base"
edition = "2024"
version.workspace = true
publish = false

[lib]
name = "lore_base"
test = false

# Writes the build version into finished artifacts; see src/version.rs.
[[bin]]
name = "lore-stamp"
path = "src/bin/lore-stamp.rs"
required-features = ["native"]

[features]
default = ["native"]
# OS services and the threaded runtime are unavailable in Workers Wasm.
# Without this feature the crate exposes the portable domain types and errors.
native = [
    "dep:backtrace", "dep:libc", "dep:parking_lot", "dep:directories",
    "dep:chrono", "dep:lore-io", "dep:pin-project", "dep:tokio",
    "rand/os_rng", "rand/small_rng", "rand/std_rng", "rand/thread_rng", "uuid/v4", "uuid/v7",
]
trace_log = ["native"]
# The shared test temp-directory helper in src/test_util.rs. Crates whose tests
# need scratch space on disk enable it from their dev-dependencies, so it stays
# out of every normal build.
test-util = ["native", "dep:tempfile"]
# Tells build.rs to compile the rpmalloc C code with -mcpu=neoverse-512tvb.
neoverse-512tvb = ["native"]

[dependencies]
# allocator
backtrace = { version = "0.3.75", default-features = false, features = ["std"], optional = true }
libc = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }
zerocopy = { workspace = true }

# directories
directories = { workspace = true, optional = true }

# error
hex = { workspace = true }
thiserror = { workspace = true }
lore-error-set = { workspace = true }

# types
bitcode = { workspace = true }
bitflags = { workspace = true }
blake3 = { workspace = true }
bytes = { workspace = true }
# Match the workspace versions while withholding OS randomness from portable builds.
rand = { version = "0.9.2", default-features = false, features = ["std"] }
# Built only when `test-util` is on, so it stays out of normal builds. It is a
# normal optional dependency rather than a dev-dependency because a dependent
# enabling the feature compiles lore-base normally, and a normal build cannot see
# dev-dependencies.
tempfile = { workspace = true, optional = true }
serde = { workspace = true }
uuid = { version = "1.18.1", default-features = false, features = ["zerocopy"] }

# log
chrono = { workspace = true, optional = true }

# runtime
lore-io = { workspace = true, optional = true }
pin-project = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

# tests
lore-macro = { workspace = true }

# fs
[target.'cfg(target_family = "windows")'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Storage_ProjectedFileSystem", "Win32_Storage_FileSystem", "Win32_System_Diagnostics", "Win32_System_Diagnostics_Debug", "Win32_System_IO", "Win32_Security"] }

[dev-dependencies]
# The crate's tests, the unit tests and the lore-stamp tests included, are built against the
# library as other crates see it, without the `test` cfg, so they reach test_util through the feature.
lore-base = { path = ".", features = ["test-util"] }
# Its serde integration: the non-self-describing format the identifier types' serde impls must
# round-trip through.
bitcode = { workspace = true, features = ["serde"] }
serde_json = { workspace = true, features = ["std"] }

[build-dependencies]
cc = "1.2.32"

[lints]
workspace = true
